<!doctype html><html lang="id"><head><style id="appStylesConsolidated">
html.app-booting,html.app-booting body{background:#e9f0f5!important}html.app-booting body>:not(#appBootLoader){display:none!important}#appBootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(700px 420px at 12% 0%,rgba(255,255,255,.78),transparent 65%),radial-gradient(850px 600px at 100% 20%,rgba(205,220,232,.52),transparent 65%),#e9f0f5;color:#20293a;font-family:"Plus Jakarta Sans","Noto Sans SC",Arial,sans-serif;opacity:1;visibility:visible;transition:opacity .22s ease,visibility .22s ease}.bootCard{text-align:center}.bootMark{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#72a3f4,#3e76df);color:#fff;font:italic 48px Georgia,serif;font-weight:700;box-shadow:7px 8px 18px rgba(68,107,188,.18),-4px -4px 10px rgba(255,255,255,.78)}
</style></head><body><div id="appBootLoader"><div class="bootCard"><div class="bootMark">文</div><div class="bootTitle">HSK Try Out by E班</div><div class="bootText">Memuat aplikasi...</div><div class="bootDots"><i></i><i></i><i></i></div></div></div><main id="app"></main>
<script>
(function(){'use strict';
const REPO='randirosandi-glitch/latihanhsk',BRANCH='refactor/dynamic-folder-catalog',API='https://api.github.com/repos/'+REPO+'/contents/';
const codeRx=/\.json$/i;
async function api(path){const r=await fetch(API+path+'?ref='+encodeURIComponent(BRANCH),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub '+r.status);return r.json()}
async function discover(){const root=await api('data');const groups=[];for(const d of (root||[]).filter(x=>x.type==='dir')){const items=await api('data/'+encodeURIComponent(d.name));const files=(items||[]).filter(x=>x.type==='file'&&codeRx.test(x.name)&&x.name.toLowerCase()!=='manifest.json'&&x.name.toLowerCase()!=='reading-passages.json');if(!files.length)continue;files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));groups.push({name:d.name,path:d.path,files,codes:files.map(f=>f.name.replace(codeRx,''))})}groups.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));return groups}
window.__hskFolderCatalogReady=discover().then(groups=>{window.__hskDynamicGroups=groups;window.__hskDynamicByCode=new Map(groups.flatMap(g=>g.files.map(f=>[f.name.replace(codeRx,''),f])));return groups});
})();
</script>
</body></html>
